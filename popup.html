<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>CineTrakt</title>
		<link rel="stylesheet" href="popup.css">
	</head>
	<body>
		<header class="app-header">
			<div class="app-brand">
				<img src="favicon.png" alt="" width="38" height="38">
				<div>
					<h1>CineTrakt</h1>
					<p id="status" role="status" aria-live="polite">Personnaliser les fonctionnalités</p>
				</div>
			</div>
			<div class="master-row">
				<div>
					<strong>Tout activer</strong>
					<span id="enabled-count"></span>
				</div>
				<label class="switch" title="Activer ou désactiver toutes les fonctionnalités">
					<input id="master-toggle" type="checkbox" aria-label="Activer toutes les fonctionnalités">
					<span aria-hidden="true"></span>
				</label>
			</div>
			<div class="footer-actions">
				<button id="reset-button" class="button secondary" type="button">Réinitialiser</button>
				<button id="apply-button" class="button primary" type="button">Appliquer</button>
			</div>
		</header>

		<main>
			<div id="feature-groups"></div>
		</main>

		<script src="settings.js"></script>
		<script src="popup.js"></script>
	</body>
</html>
